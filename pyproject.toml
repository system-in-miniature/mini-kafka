[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minikafka-reference"
version = "0.1.0"
description = "Direct-first MiniKafka reference implementation"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mkdocs-material>=9.6,<10",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/minikafka"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
