name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --dev
      - name: Run tests
        run: uv run pytest -q
      - name: Check formatting and imports
        run: uv run ruff check .
      - name: Verify Journey tooling and Stage chain
        run: |
          uv run pytest -q journey/tools/tests
          uv run python -m journey.tools.render_pages
          git diff --exit-code -- docs/journey docs/zh/journey
          uv run python -m journey.tools.build_journey --check
      - name: Build documentation strictly
        run: uv run mkdocs build --strict
      - name: Smoke labs
        run: |
          uv run python -m minikafka.labs.leader_failure
          uv run python -m minikafka.labs.rebalance
